research_intro: My research focuses on robotic manipulation and grasping. I am currently exploring how to reduce human intervention in the post-training and deployment of robotic manipulation policies, including vision-language-action (VLA) models, through DAgger-based learning, reinforcement learning, and agentic approaches.
